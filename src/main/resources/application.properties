spring.application.name=restaurantefase2

# Configurações de Banco de Dados (Localhost para rodar via IDE)
spring.datasource.url=jdbc:postgresql://localhost:5432/tech_challenge_db
spring.datasource.username=usuario_restaurante
spring.datasource.password=senha_secreta

# O Hibernate apenas valida a estrutura criada pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# O baseline é uma boa prática caso o banco já tenha alguma tabela pré-existente
spring.flyway.baseline-on-migrate=true