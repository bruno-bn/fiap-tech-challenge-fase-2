version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tech_challenge_postgres
    environment:
      POSTGRES_USER: usuario_restaurante
      POSTGRES_PASSWORD: senha_secreta
      POSTGRES_DB: tech_challenge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Garante que o banco está totalmente pronto antes de liberar a API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_restaurante -d tech_challenge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: . # Manda o Docker ler o Dockerfile local
    container_name: tech_challenge_fase2_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # Só inicia o app quando o banco estiver "healthy"
    environment:
      # Sobrescreve as variáveis do application.properties para usar o Docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tech_challenge_db
      - SPRING_DATASOURCE_USERNAME=usuario_restaurante
      - SPRING_DATASOURCE_PASSWORD=senha_secreta
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true

  adminer:
    image: adminer
    container_name: tech_challenge_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
